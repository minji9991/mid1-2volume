<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부피를 만드는 시간 · 민지네 수학</title><style>
:root{--ink:#243e36;--green:#26634f;--paper:#faf8f2;--muted:#758179;--line:#dedfd4;--orange:#da8858}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:16px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:11px 17px;border-radius:12px;font-weight:650}button:hover{background:#eef2e8}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #df9b55;outline-offset:3px}button.primary,.active{background:var(--green)!important;color:white!important;border-color:var(--green)}button:disabled{opacity:.45;cursor:default}header{border-bottom:1px solid var(--line);padding:18px 4%;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:-.5px}.brand small{font-size:11px;letter-spacing:2px;color:var(--muted);display:block;margin-top:4px}.status{font-size:12px;color:var(--muted)}main{max-width:1450px;margin:auto;padding:32px 4%}nav{display:flex;gap:9px;margin:24px 0;flex-wrap:wrap}nav button{flex:1;min-width:150px;text-align:left}nav small{display:block;font-size:11px;margin-bottom:6px;opacity:.7}.eyebrow{font-size:12px;color:var(--green);letter-spacing:2px;font-weight:750}h1{font-size:clamp(28px,3.5vw,44px);letter-spacing:-1.8px;margin:10px 0}h2{font-size:23px;letter-spacing:-.6px}p{line-height:1.7} .sub{color:var(--muted);margin:6px 0}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:24px;align-items:start}.stage{position:sticky;top:16px;border-radius:24px;background:#eaece1;overflow:hidden;border:1px solid #dfe3d8}.stagehead{padding:20px 22px;display:flex;justify-content:space-between;gap:12px}.stagehead strong{font-size:14px}canvas{display:block;width:100%;height:440px;touch-action:none}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:0 20px 16px}.tools button{font-size:13px;padding:9px 12px}.hint{padding:0 22px 20px;color:#627268;font-size:13px;line-height:1.7}.card{padding:23px;background:#fff;border:1px solid var(--line);border-radius:20px;margin-bottom:16px}.card h2{margin:0 0 12px}.label{display:block;font-size:13px;font-weight:650;margin:14px 0 7px}input,textarea,select{padding:12px;border:1px solid #ccd5c9;border-radius:10px;background:#fcfcf9;max-width:100%}textarea{width:100%;min-height:90px;resize:vertical}input[type=number]{width:110px}input[type=range]{width:100%;padding:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.feedback{font-size:14px;line-height:1.7;color:#36674e;min-height:24px;margin-top:10px}.bad{color:#ac5937}.slots{line-height:3.5;font-size:17px}.slot{display:inline-flex;min-width:85px;min-height:42px;align-items:center;justify-content:center;border:1.5px dashed #9db5a3;border-radius:10px;background:#f5f8f0;color:#41634e;padding:0 10px;margin:3px;line-height:1.5;vertical-align:middle;font-size:15px}.slot.filled{border-style:solid;background:#e9f0df}.tokens{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.token{background:#f8eddc;border-color:#ead5b5;font-size:14px;touch-action:none}.token.chosen{outline:3px solid #da8858}.equation{padding:10px 0;border-bottom:1px solid #edf0e7;line-height:2.8;font-size:14px}.note{background:#f6f5eb}.pill{padding:5px 10px;border-radius:20px;background:#f5f7ef;font-size:12px}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.progress{height:4px;background:#e2e6da}.progress i{display:block;height:100%;background:var(--orange);transition:width .4s}dialog{border:1px solid var(--line);border-radius:24px;padding:28px;width:440px;max-width:92vw;color:var(--ink)}dialog::backdrop{background:#20372d77;backdrop-filter:blur(6px)}dialog input{width:100%}dialog h2{margin-top:0}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.dash{overflow:auto} .complete{padding:15px;background:#eaf2df;border-radius:12px}details{line-height:1.8}summary{cursor:pointer}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#244d3e;color:white;border-radius:12px;padding:12px 22px;z-index:5;max-width:90vw;font-size:14px} @media(max-width:850px){.grid{grid-template-columns:1fr}.stage{position:relative;top:0}canvas{height:360px}main{padding:22px 4%}nav{gap:6px}nav button{min-width:40%;font-size:13px}header{flex-wrap:wrap}.card{padding:19px}}
.screen-gate{position:fixed;inset:0;background:#f4f5edfa;z-index:100;display:grid;place-items:center;backdrop-filter:blur(15px)}.screen-gate[hidden]{display:none}.screen-gate>div{max-width:520px;padding:32px;text-align:center}.brand{display:flex;align-items:center;gap:14px}.brand img{width:76px;height:76px;object-fit:contain}.brand small{letter-spacing:1px}.stage canvas{cursor:grab}.stage canvas:active{cursor:grabbing}</style><header><div class="brand"><img src="logo.png" alt="민지네 수학 로고" width="76" height="76"><div>민지네 수학<small>부피 탐구실</small></div></div><div class="row"><span id="who" class="pill">체험 모드</span><span id="saveStatus" class="status">이 기기에 저장</span><button id="loginButton">학생 입장</button><button id="teacherButton">교사</button></div></header><div class="progress"><i id="progress"></i></div><div id="fullscreenGate" class="screen-gate" hidden role="dialog" aria-modal="true" aria-label="전체 화면으로 돌아오기"><div><span class="eyebrow">민지네 수학</span><h2>전체 화면에서 이어서 해 보자.</h2><p>분할 화면을 닫고 아래 버튼을 눌러 줘.<br>지금까지 한 활동은 이 기기에 남아 있어.</p><button id="fullscreenResume" class="primary">전체 화면으로 돌아가기</button> <button id="fullscreenLogout">로그아웃</button><p id="fullscreenError" class="feedback bad"></p></div></div><main><span class="eyebrow">자르고 · 옮기고 · 채우며 발견하는 수학</span><h1>부피를 만드는 시간</h1><p class="sub">손으로 먼저 발견하고, 나만의 식으로 설명해 보자.</p><nav id="nav"></nav><section id="content"></section></main><div id="toast" hidden role="status"></div>
<dialog id="login"><h2>오늘의 탐구를 시작할까?</h2><p class="sub">처음 정한 비밀번호로 다음 시간에도 이어서 할 수 있어.</p><form id="loginForm"><label class="label">반 / 번호</label><div class="row"><input name="classNo" type="number" min="1" max="30" placeholder="반" required><input name="number" type="number" min="1" max="50" placeholder="번호" required></div><label class="label">이름</label><input name="name" maxlength="20" required autocomplete="name"><label class="label">개인 비밀번호 (6자 이상)</label><input name="pin" type="password" minlength="6" maxlength="64" required autocomplete="current-password"><label class="label">선생님이 알려 준 입장 코드</label><input name="code" required maxlength="80"><p id="loginMsg" class="feedback"></p><div class="row"><button class="primary" type="submit">전체 화면으로 입장 / 이어하기</button><button type="button" onclick="document.querySelector('#login').close()">닫기</button></div></form></dialog>
<dialog id="teacherLogin"><h2>교사 대시보드</h2><form id="teacherForm"><label class="label">교사 비밀번호</label><input name="password" type="password" required><p id="teacherMsg" class="feedback"></p><div class="row"><button class="primary">들어가기</button><button type="button" onclick="document.querySelector('#teacherLogin').close()">닫기</button></div></form></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), titles=['직육면체 복습','삼각기둥 케이크','모든 기둥의 부피','뿔의 부피'];
let session=JSON.parse(sessionStorage.getItem('volume-session')||'null'), key=()=> 'volume-lab-v1-'+(session?.id||'demo'), state=JSON.parse(localStorage.getItem(key())||'{}');
function upgradeState(){if(state.geometryVersion!==2){state.generalCuts=0;state.generalMatched=false;state.geometryVersion=2;if(state.done)delete state.done[1]}}upgradeState();
let step=state.step||0, sub=state.sub||0, scene, canvas, ctx, view={yaw:-.6,pitch:.5,zoom:1}, selected=0, meshes=[], faces=[], lines=[], targets=[], drag=null, selectedToken='', saveTimer, syncing=false, dirty=0, locks=[false,false,false,false], teacherToken='', pourAnimation=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3000)}
function persist(){state._updatedAt=Date.now();state.step=step;state.sub=sub;try{localStorage.setItem(key(),JSON.stringify(state))}catch{}dirty++;$('#saveStatus').textContent=session?'저장 대기 중':'이 기기에 저장';clearTimeout(saveTimer);saveTimer=setTimeout(sync,600)}
async function api(action,data={},token=session?.token){const r=await fetch('/api/workbook',{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...data,fullscreen:isStudyFullscreen()})});let j;try{j=await r.json()}catch{throw Error('서버 연결 전이에요. 지금은 체험 모드를 이용해 주세요.')}if(!r.ok)throw Error(j.error||'연결을 확인해 주세요.');return j}
async function sync(){if(!session||syncing)return;syncing=true;const d=dirty;try{await api('save',{state});$('#saveStatus').textContent='서버 저장 완료';if(d!==dirty)saveTimer=setTimeout(sync,100)}catch(e){$('#saveStatus').textContent='기기 저장됨 · 서버 재시도';saveTimer=setTimeout(sync,15000)}finally{syncing=false}}
function complete(id){state.done??={};state.done[id]=true;persist();updateNav()}
function updateNav(){ $('#nav').innerHTML=titles.map((t,i)=>`<button class="${step===i?'active':''}" data-step="${i}"><small>ACTIVITY 0${i+1} ${state.done?.[i]?'✓':''}</small>${t}${locks[i]?' 🔒':''}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(locks[+b.dataset.step])return toast('선생님이 아직 열지 않은 활동이야.');step=+b.dataset.step;sub=step===1?0:step===3?0:0;persist();render()});$('#progress').style.width=(Object.keys(state.done||{}).length/4*100)+'%';$('#who').textContent=session?`${session.classNo}반 ${session.number}번 ${session.name}`:'체험 모드';$('#loginButton').textContent=session?'나가기':'학생 입장'}
function card(title,body,cls=''){return `<div class="card ${cls}"><h2>${title}</h2>${body}</div>`}
function stage(title,body,hint){return `<div class="stage"><div class="stagehead"><strong>${title}</strong><span class="pill">직접 조작해 보기</span></div><canvas id="scene" aria-label="${title}. 아래 조작 버튼도 사용할 수 있습니다."></canvas><div class="tools">${body}</div><div class="hint" id="sceneHint">${hint}</div></div>`}
function btn(id,text){return `<button id="${id}">${text}</button>`}
function input(id,placeholder='생각을 써 보자'){return `<input id="${id}" value="${esc(state[id]||'')}" placeholder="${placeholder}" autocomplete="off">`}
function note(id){return card('발견 노트',`<label class="label" for="${id}">왜 그런지 내 말로 설명해 보자.</label><textarea id="${id}" placeholder="조각을 옮겼더니… / 높이가 같아서…">${esc(state[id]||'')}</textarea>`,'note')}
function slot(id,answer){return `<button class="slot ${state[id]?'filled':''}" data-slot="${id}" data-answer="${answer}">${esc(state[id]||'빈칸')}</button>`}
function tokens(words){return `<div class="tokens">${words.map(w=>`<button class="token" draggable="true" data-word="${w}">${w}</button>`).join('')}</div><p class="sub" style="font-size:12px">카드를 빈칸으로 끌어 놓거나, 카드 → 빈칸 순서로 눌러도 돼.</p>`}
function fraction(v,d){v=v.replace(/\s/g,'');return d===2?['1/2','½','0.5','절반','반'].includes(v):['1/3','⅓'].includes(v)}
const productGroups=[['reviewBase','reviewHeight'],['f2','f3'],['f4','f5'],['f6','f7'],['p1','p2'],['p3','p4'],['p5','p6'],['v1','v2','v3']];
function validSlotAnswers(slots,answers=state){const byId=new Map(slots.map(x=>[x.dataset.slot,x]));let checked=new Set();for(let slot of slots){let id=slot.dataset.slot;if(checked.has(id))continue;let group=productGroups.find(g=>g.includes(id)&&g.every(k=>byId.has(k)))||[id];let actual=group.map(k=>String(answers[k]||'').trim()).sort(),expected=group.map(k=>byId.get(k).dataset.answer).sort();if(actual.some((x,i)=>x!==expected[i]))return false;group.forEach(k=>checked.add(k))}return true}
function checkSlots(container,onCorrect){let ok=validSlotAnswers([...container.querySelectorAll('[data-slot]')]);toast(ok?'좋아! 곱하는 순서가 달라도 같은 부피를 나타내면 맞아.':'필요한 항을 하나씩 넣었는지 확인해 봐. 곱하는 순서는 바꿔도 괜찮아.');if(ok)onCorrect()}
function triangleReady(){return !!(state.halfOK0&&state.diagonalCuts>=1&&state.halfOK1&&state.generalCuts>=3&&state.generalMatched)}
function updateTriangleAccess(){if(step!==1)return;let ready=triangleReady(),practice=$('#trianglePractice'),gate=$('#triangleGate');if(practice){practice.hidden=!ready;practice.inert=!ready}if(gate){gate.hidden=ready;gate.textContent=!state.halfOK0||!state.diagonalCuts?'① 대각선으로 잘라 보고 1/2인지 확인하면 다음 활동을 할 수 있어.':!state.halfOK1||state.generalCuts<3?'② 다른 모양도 잘라 보고 1/2인지 확인해 줘. 두 활동을 마치면 문장과 식 만들기가 열려.':'② 네 조각을 같은 모양끼리 포개면 문장과 식 만들기가 열려.'}let tab=$('#sub1');if(tab)tab.disabled=!(state.halfOK0&&state.diagonalCuts>=1)}
function bindCommon(){document.querySelectorAll('input,textarea,select').forEach(e=>{if(e.closest('dialog')||!e.id)return;e.oninput=()=>{state[e.id]=e.value;persist()}});document.querySelectorAll('.token').forEach(e=>{e.onclick=()=>{selectedToken=e.dataset.word;document.querySelectorAll('.token').forEach(t=>t.classList.toggle('chosen',t===e))};e.ondragstart=ev=>{selectedToken=e.dataset.word;ev.dataTransfer.setData('text/plain',selectedToken)}});document.querySelectorAll('.slot').forEach(e=>{const fill=w=>{if(![...document.querySelectorAll('.token')].some(t=>t.dataset.word===w))return;state[e.dataset.slot]=w;e.textContent=w;e.classList.add('filled');persist()};e.onclick=()=>selectedToken?fill(selectedToken):toast('먼저 아래의 단어 카드를 골라 줘.');e.ondragover=ev=>ev.preventDefault();e.ondrop=ev=>{ev.preventDefault();fill(ev.dataTransfer.getData('text/plain'))}})}
function render(){pourAnimation=null;fillAnimation=null;cancelAnimationFrame(frameId);updateNav();if(locks[step]){$('#content').innerHTML=card('잠시 기다려 주세요','선생님이 이 활동을 열면 계속할 수 있어.');updateFullscreenGate();return}let left,right;view={yaw:-.6,pitch:.5,zoom:1};
if(step===0){scene='review';left=stage('한 층씩 쌓으면, 부피가 보여',btn('layer','단위 격자 켜기 / 끄기')+btn('rotateView','시점 돌리기'),'빈 곳을 드래그하면 도형이 돌아가. 가로 4 cm, 세로 3 cm, 높이 2 cm인 직육면체야.');right=card('01. 기억을 꺼내 볼까?',`<p>직육면체의 부피는 어떻게 구했을까?</p><label class="label">나의 방법</label><textarea id="reviewMethod" placeholder="가로, 세로, 높이를 이용해서…">${esc(state.reviewMethod||'')}</textarea><label class="label">이 직육면체의 부피는?</label><div class="row">${input('reviewAnswer','숫자')}<span>cm³</span>${btn('reviewCheck','확인')}</div><p id="reviewFeedback" class="feedback"></p>`)+card('밑면을 기준으로 다시 쓰면',`<div class="slots">부피 = ${slot('reviewBase','밑넓이')} × ${slot('reviewHeight','높이')}</div>${tokens(['높이','밑넓이','둘레'])}${btn('reviewFormula','식 완성하기')}`);}
if(step===1){if(sub===1&&!(state.halfOK0&&state.diagonalCuts>=1))sub=0;scene=sub===0?'diagonal':'general';left=stage(sub===0?'첫 번째 케이크 · 대각선으로 자르기':'두 번째 케이크 · 다른 삼각기둥',btn('knife','🔪 칼 잡기')+btn('pieceMode','조각 옮기기')+btn('viewMode','전체 도형 돌리기')+btn('rotatePiece','선택 조각 180°')+btn('resetScene','다시 자르기'),sub===0?'칼 잡기를 누르고, 빛나는 면 위로 칼을 챱! 움직여 봐. 칼날이 아래까지 내려가면 조각이 떨어져.':'양옆 선을 자르고, 마지막에 수선의 발까지 잘라 네 조각으로 나눠 봐. 초록·보라 조각을 180° 돌려 가운데의 같은 모양에 각각 포개 보자.');right=card('02. 삼각기둥은 얼마나 될까?',`<div class="row"><button id="sub0" class="${sub===0?'active':''}">① 대각선으로</button><button id="sub1" class="${sub===1?'active':''}">② 다른 모양으로</button></div><p>${sub===0?'직육면체 케이크를 대각선으로 잘라 만든 한 조각은 원래 케이크 부피의 얼마일까?':'가운데 큰 삼각기둥의 부피는 원래 케이크 부피의 얼마일까? 수선의 발을 내려 네 조각으로 자른 뒤, 왼쪽과 오른쪽에서 각각 같은 모양끼리 포개어 확인해 보자.'}</p><div class="row">${input('half'+sub,'분수로 입력')}${btn('halfCheck','확인')}</div><p id="halfFeedback" class="feedback"></p>`)+`<div id="triangleGate" class="card note" role="status"></div><section id="trianglePractice" hidden>`+card('조각에서 문장으로',`<div class="slots">${slot('s1','삼각기둥')} 모양 케이크의 ${slot('s2','부피')}도 ${slot('s3','직육면체')} 모양 케이크 부피의 ${slot('s4','1/2')}이다.</div>${tokens(['부피','직육면체','1/2','삼각기둥'])}`)+card('같은 내용을 식으로 이어 보자',`<div class="equation">삼각기둥의 부피 = ${slot('f1','1/2')} × (직육면체의 부피)</div><div class="equation">= 1/2 × {${slot('f2','직육면체의 밑넓이')} × ${slot('f3','높이')}}</div><div class="equation">= {${slot('f4','1/2')} × (직육면체의 밑넓이)} × ${slot('f5','높이')}</div><div class="equation">= ${slot('f6','삼각기둥의 밑넓이')} × ${slot('f7','높이')}</div>${tokens(['높이','1/2','삼각기둥의 밑넓이','직육면체의 밑넓이'])}${btn('triangleCheck','문장과 식 확인')}`)+`</section>`+note('note1');}

<script>

const C=['#df9a72','#7eae9e','#aaa0cf','#e6b889'], rect=[[-1.5,-1],[1.5,-1],[1.5,1],[-1.5,1]], pent=Array.from({length:5},(_,i)=>[1.55*Math.cos(-Math.PI/2+i*2*Math.PI/5),1.55*Math.sin(-Math.PI/2+i*2*Math.PI/5)]);

let surface=polys.find(p=>p.length>=3&&p.every(v=>Math.abs(v[1]-level)<1e-6));
return {t,tilt,amount,polys,vs,shift,offset,lipPoint,off,transfer,surface,level,flow:!!pourAnimation&&t>.25&&t<.70&&amount>.00001}}
function drawWaterMeshes(){let w=waterPose();waterFrame=w;let bowl=mesh(w.vs,bowlFaces.slice(1),'#c5e2e7',10);bowl.shift=w.shift;bowl.offset=w.offset;bowl.alpha=.13;bowl.glass=true;addFaces(bowl);if(w.amount>1e-7){let fluid=polyMesh(w.polys,'#56a9ce',10);fluid.shift=w.shift;fluid.offset=w.offset;fluid.alpha=.78;addFaces(fluid)}let fill=(state.pours||0)+w.transfer;if(fill>0){let y=-1+2*fill/3,m=prism([[-1,-1],[1,-1],[1,1],[-1,1]],'#64b3d4',11,-1,y);m.offset=[w.off,0];m.alpha=.75;addFaces(m)}}
function drawStream(p,q,width=5){let time=performance.now()/1000;ctx.lineCap='round';ctx.strokeStyle='#429dcb99';ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.strokeStyle='#d4f7ff';ctx.lineWidth=width*.27;ctx.stroke();for(let i=0;i<7;i++){let u=(time*1.6+i/7)%1,k=u*u;ctx.fillStyle='#e0f9ff';ctx.beginPath();ctx.ellipse(mix(p[0],q[0],k),mix(p[1],q[1],k),1.3,3,0,0,7);ctx.fill()}}
function drawRipples(center,offset,radius=.75){let time=performance.now()/1000;ctx.strokeStyle='#d6f6ff';ctx.lineWidth=1.5;for(let i=0;i<3;i++){let t=(time*.8+i/3)%1;ctx.globalAlpha=(1-t)*.7;let ps=Array.from({length:40},(_,k)=>{let a=k/40*Math.PI*2;return project([center[0]+Math.cos(a)*radius*t,center[1],center[2]+Math.sin(a)*radius*t],offset)});path(ps);ctx.stroke()}ctx.globalAlpha=1}
function drawWaterDetails(){let w=waterFrame;if(!w)return;wireCube([w.off,0]);for(let [a,b] of [[1,2],[2,3],[3,4],[4,1],[0,1],[0,2],[0,3],[0,4]]){ctx.strokeStyle='#588596aa';ctx.lineWidth=2;line3(w.vs[a].map((x,i)=>x+w.shift[i]),w.vs[b].map((x,i)=>x+w.shift[i]),w.offset)}
label('사각뿔 그릇',[size.w/2-w.off,size.h-22]);label('정육면체 그릇',[size.w/2+w.off,size.h-22]);
if(w.surface){let surface=w.surface.map(p=>p.map((x,i)=>x+w.shift[i]));ctx.save();path(surface.map(p=>project(p,w.offset)));ctx.clip();let center=[0,1,2].map(k=>surface.reduce((s,p)=>s+p[k],0)/surface.length);drawRipples(center,w.offset,.85*Math.cbrt(w.amount));ctx.restore()}
if(fillAnimation){let p=project([0,2.15,0],[-w.off,0]),q=project([0,w.level,0],[-w.off,0]);ctx.strokeStyle='#6f939a';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p[0]-25,p[1]-13);ctx.lineTo(p[0],p[1]-13);ctx.lineTo(p[0],p[1]-4);ctx.stroke();drawStream(p,q,5);label('물을 채우는 중…',[size.w/2,25]);}
if(w.flow){let q=project([0,-1+2*((state.pours||0)+w.transfer)/3,0],[w.off,0]);let strength=Math.sin(clamp((w.t-.25)/.45)*Math.PI);drawStream(w.lipPoint,q,3+4*strength);drawRipples([0,-1+2*((state.pours||0)+w.transfer)/3,0],[w.off,0]);}
if(pourAnimation)label(w.t<.25?'그릇을 조심히 들어 올려…':w.t<.7?'물줄기를 따라 수위를 살펴보자.':'남은 물까지 붓고 제자리로.',[size.w/2,25]);}
function updateWaterControls(){if(scene!=='water')return;let busy=!!(fillAnimation||pourAnimation);if($('#fill'))$('#fill').disabled=busy||state.waterFull||(state.pours||0)>=3;if($('#pour'))$('#pour').disabled=busy||!state.waterFull||(state.pours||0)>=3}
function fillWater(){if(fillAnimation||pourAnimation||state.waterFull)return;if((state.pours||0)>=3)return toast('정육면체가 가득 찼어. 처음부터 다시 해 볼 수 있어.');fillAnimation={start:performance.now()};updateWaterControls();function frame(){if(!fillAnimation||scene!=='water')return;draw();if(performance.now()-fillAnimation.start>=WATER_FILL_MS){state.waterFull=true;fillAnimation=null;persist();updateWaterControls();draw();$('#waterStatus').textContent=`${state.pours||0}번 부었어. 뿔 그릇이 가득 찼어!`;return}frameId=requestAnimationFrame(frame)}frameId=requestAnimationFrame(frame)}
function pour(){if(pourAnimation||fillAnimation)return;if(!state.waterFull)return toast('먼저 뿔 그릇을 가득 채워 줘.');if((state.pours||0)>=3)return;pourAnimation={start:performance.now()};updateWaterControls();function frame(){if(!pourAnimation||scene!=='water')return;if(performance.now()-pourAnimation.start>=WATER_POUR_MS){state.pours=(state.pours||0)+1;state.waterFull=false;pourAnimation=null;persist();updateWaterControls();$('#waterStatus').textContent=`${state.pours}번 부었어.${state.pours===3?' 정육면체가 가득 찼어!':''}`;draw();return}draw();frameId=requestAnimationFrame(frame)}frameId=requestAnimationFrame(frame)}

</script>
<script>
let paused=false, dashboard=false, dashboardRows=[], lastHidden=false;
$('#loginButton').onclick=async()=>{if(session){await sync();session=null;sessionStorage.removeItem('volume-session');state=JSON.parse(localStorage.getItem(key())||'{}');upgradeState();step=state.step||0;sub=state.sub||0;locks=[false,false,false,false];paused=false;render()}else $('#login').showModal()};
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='입장 확인 중…';try{await enterStudyFullscreen();let data=Object.fromEntries(new FormData(e.target)),r=await api('login',data);session=r.session;sessionStorage.setItem('volume-session',JSON.stringify(session));let local=JSON.parse(localStorage.getItem(key())||'{}');state=(local._updatedAt||0)>(r.state?._updatedAt||0)?local:(r.state||local);upgradeState();step=state.step||0;sub=state.sub||0;locks=r.locks;paused=r.paused;$('#login').close();$('#loginForm').reset();persist();if(paused)showPaused();else render()}catch(err){$('#loginMsg').textContent=err.message}};
$('#teacherButton').onclick=()=>{$('#teacherLogin').showModal()};$('#teacherForm').onsubmit=async e=>{e.preventDefault();try{let r=await api('teacherLogin',Object.fromEntries(new FormData(e.target)));teacherToken=r.token;$('#teacherLogin').close();e.target.reset();dashboard=true;updateFullscreenGate();await refreshDashboard(true)}catch(err){$('#teacherMsg').textContent=err.message}};
function showPaused(){updateNav();$('#content').innerHTML=card('활동이 잠시 정지되었어','<p>선생님이 활동을 다시 허용하면 이어서 할 수 있어. 지금까지의 기록은 남아 있어.</p>');document.querySelectorAll('#nav button').forEach(x=>x.disabled=true)}
async function heartbeat(){if(!session||dashboard)return;try{await flushLeaves();let r=await api('heartbeat');let changed=JSON.stringify(locks)!==JSON.stringify(r.locks)||paused!==r.paused;locks=r.locks;paused=r.paused;if(changed){if(paused)showPaused();else render()}}catch(e){$('#saveStatus').textContent='연결 확인 중 · 기기 기록 유지'}}
let flushing=false;async function flushLeaves(){if(!session||flushing)return;flushing=true;try{let k=key()+'-leaves',q=JSON.parse(localStorage.getItem(k)||'[]');for(let eventId of q){await api('leave',{eventId});let current=JSON.parse(localStorage.getItem(k)||'[]');localStorage.setItem(k,JSON.stringify(current.filter(x=>x!==eventId)))}}catch{}finally{flushing=false}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(session&&!paused&&!dashboard&&!lastHidden){lastHidden=true;queueDeparture();} }else{lastHidden=false;heartbeat()}updateFullscreenGate()});
window.addEventListener('online',()=>{sync();heartbeat()});
setInterval(()=>{if(dashboard)refreshDashboard(false);else heartbeat()},10000);
async function refreshDashboard(full){try{let r=await api('dashboard',{},teacherToken);dashboardRows=r.students;if(full){$('#nav').innerHTML='';$('#content').innerHTML=card('교사 관리 · 부피를 만드는 시간',`<div class="row"><label>반 <select id="classFilter"><option value="">전체</option>${[1,2,3,4,5,6].map(i=>`<option value="${i}">1학년 ${i}반</option>`).join('')}</select></label>${btn('dashBack','학생 화면')}${btn('exportCsv','기록 내려받기')}<span class="status">10초마다 갱신 · 최근 35초 이내 응답을 접속 중으로 표시</span></div><div id="alerts"></div><h2 style="margin-top:24px">활동 열기 · 잠그기</h2><p class="sub">반을 선택하면 그 반에만 적용돼. 전체는 6개 반에 모두 적용해.</p><div id="lockControls" class="row"></div><div class="dash"><table><thead><tr><th>학생</th><th>접속 / 마지막 응답</th><th>활동 / 완료</th><th>이탈</th><th>관리</th></tr></thead><tbody id="studentRows"></tbody></table></div><div id="studentDetail"></div>`);$('#classFilter').onchange=()=>paintDashboard(r);on('dashBack',()=>{dashboard=false;teacherToken='';if(paused)showPaused();else render()});on('exportCsv',exportCsv)}paintDashboard(r)}catch(e){toast(e.message)}}
function paintDashboard(r){if(!dashboard||!$('#classFilter'))return;let cls=$('#classFilter').value,rows=r.students.filter(s=>!cls||String(s.class_no)===cls),alerts=rows.filter(s=>s.departures>=5);$('#alerts').innerHTML=alerts.length?`<p class="complete bad" role="alert">⚑ 이탈 5회 이상: ${alerts.map(s=>`${s.class_no}반 ${s.student_no}번 ${esc(s.name)} (${s.departures}회)`).join(' · ')}</p>`:'<p class="feedback">이탈 5회 이상 알림 없음</p>';let settings=cls?[r.settings[cls]]:Object.values(r.settings);$('#lockControls').innerHTML=titles.map((t,i)=>{let open=settings.every(x=>x?.[i]===false);return `<button data-lock="${i}" data-open="${open}">${i+1}. ${t} · ${open?'열림 → 잠그기':'잠김/혼합 → 열기'}</button>`}).join('');document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=async()=>{try{await api('lock',{classNo:cls?+cls:null,index:+b.dataset.lock,locked:b.dataset.open==='true'},teacherToken);refreshDashboard(false)}catch(e){toast(e.message)}});$('#studentRows').innerHTML=rows.length?rows.map(s=>`<tr><td>${s.class_no}반 ${s.student_no}번<br><strong>${esc(s.name)}</strong></td><td>${s.paused?'⏸ 정지':Date.now()-new Date(s.last_seen).getTime()<35000?'● 접속 중':'○ 응답 없음'}${s.screen_fullscreen===false?' · 전체 화면 아님':''}<br><small>${new Date(s.last_seen).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'})}</small></td><td>${(s.state?.step||0)+1}번 활동<br>${Object.keys(s.state?.done||{}).length}/4 완료</td><td class="${s.departures>=5?'bad':''}">${s.departures}회</td><td><button data-pause="${s.id}" data-paused="${s.paused}">${s.paused?'정지 해제':'활동 정지'}</button> <button data-detail="${s.id}">답변</button></td></tr>`).join(''):'<tr><td colspan="5">아직 입장한 학생이 없습니다.</td></tr>';document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=async()=>{try{await api('pause',{id:b.dataset.pause,paused:b.dataset.paused!=='true'},teacherToken);refreshDashboard(false)}catch(e){toast(e.message)}});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{let s=r.students.find(s=>s.id===b.dataset.detail);$('#studentDetail').innerHTML=card(`${s.class_no}반 ${s.student_no}번 ${esc(s.name)}의 기록`,Object.entries(s.state||{}).filter(([k,v])=>typeof v==='string').map(([k,v])=>`<p><strong>${esc(fieldNames[k]||k)}</strong><br>${esc(v)}</p>`).join('')||'<p>아직 작성한 답변이 없습니다.</p>')})}
const fieldNames={reviewMethod:'직육면체 부피를 구하는 방법',reviewAnswer:'직육면체 부피',half0:'대각선 케이크 비율',half1:'일반 삼각기둥 비율',pentCount:'삼각기둥의 수',pourAnswer:'물 붓기 횟수',third:'뿔의 부피 비율',note0:'활동 1 발견 노트',note1:'활동 2 발견 노트',note2:'활동 3 발견 노트',note3:'활동 4 이전 노트',understanding:'오늘의 이해도',questionsToday:'오늘의 질문'};
function exportCsv(){let cls=$('#classFilter').value;let rows=dashboardRows.filter(s=>!cls||String(s.class_no)===cls),cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';let data=[['반','번호','이름','이탈 횟수','현재 활동','완료 수','활동2 노트','활동3 노트','오늘의 이해도','오늘의 질문'],...rows.map(s=>[s.class_no,s.student_no,s.name,s.departures,(s.state?.step||0)+1,Object.keys(s.state?.done||{}).length,s.state?.note1||'',s.state?.note2||'',s.state?.understanding||'',s.state?.questionsToday||''])];let url=URL.createObjectURL(new Blob(['\ufeff'+data.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='부피_학습기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
let screenBlocked=false,lastDepartureAt=0;
function isStudyFullscreen(){let active=!!(document.fullscreenElement||document.webkitFullscreenElement);let w=window.screen?.width||window.innerWidth,h=window.screen?.height||window.innerHeight;return active&&window.innerWidth>=w*.88&&window.innerHeight>=h*.75&&!document.hidden}
async function enterStudyFullscreen(){let el=document.documentElement,request=el.requestFullscreen||el.webkitRequestFullscreen;if(!request)throw Error('이 브라우저는 필요한 전체 화면 기능을 지원하지 않아요. 전체 화면을 지원하는 브라우저나 기기로 접속해 주세요.');if(!(document.fullscreenElement||document.webkitFullscreenElement))await request.call(el);if(!isStudyFullscreen())throw Error('분할 화면을 종료하고 브라우저 확대 비율을 기본값으로 맞춘 뒤, 전체 화면으로 다시 들어와 주세요.');updateFullscreenGate()}
function queueDeparture(){if(!session||paused||dashboard||Date.now()-lastDepartureAt<3000)return;lastDepartureAt=Date.now();let q=JSON.parse(localStorage.getItem(key()+'-leaves')||'[]');q.push(crypto.randomUUID());localStorage.setItem(key()+'-leaves',JSON.stringify(q));flushLeaves()}
function updateFullscreenGate(){let blocked=!!session&&!dashboard&&!isStudyFullscreen(),el=$('#fullscreenGate');if(!el)return;if(blocked&&!screenBlocked)queueDeparture();screenBlocked=blocked;el.hidden=!blocked;let main=$('main');if(main)main.inert=blocked;el.setAttribute('aria-hidden',String(!blocked));}
$('#fullscreenResume').onclick=async()=>{try{await enterStudyFullscreen();$('#fullscreenError').textContent='';heartbeat()}catch(e){$('#fullscreenError').textContent=e.message}};
$('#fullscreenLogout').onclick=()=>{session=null;sessionStorage.removeItem('volume-session');locks=[false,false,false,false];state=JSON.parse(localStorage.getItem(key())||'{}');upgradeState();step=state.step||0;sub=state.sub||0;paused=false;render();updateFullscreenGate()};
for(let event of ['fullscreenchange','webkitfullscreenchange'])document.addEventListener(event,updateFullscreenGate);
window.addEventListener('resize',updateFullscreenGate);
setInterval(()=>{if(canvas?.isConnected&&sceneMode==='cut'&&lines[(state[scene+'Cuts']||0)]&&!cutAnimation&&!dropAnimation)draw()},100);

// Validate supported cohort on the client; the server applies the same bounds.
$('#loginForm [name=classNo]').max=6;$('#loginForm [name=number]').max=30;
if(session){locks=[true,true,true,true];render();heartbeat()}else render();updateFullscreenGate();
</script></html>
